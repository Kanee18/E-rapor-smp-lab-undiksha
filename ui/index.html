<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Raport — National Plus Class</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <aside class="rail">
    <div class="wordmark">
      <img class="logo" src="logo-sekolah.png" alt="Logo Sekolah Lab Undiksha" width="28" height="40">
      <div>
        <div class="name">E-Raport</div>
        <div class="meta" id="rail-meta">National Plus Class</div>
      </div>
    </div>
    <nav id="nav" aria-label="Menu"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <main>
    <header class="page-head">
      <div>
        <div id="page-step" class="stepper" hidden></div>
        <h1 id="page-title">Memuat…</h1>
        <p id="page-desc" class="lede"></p>
      </div>
      <div id="page-actions" class="actions"></div>
    </header>
    <div id="content" class="content"></div>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
